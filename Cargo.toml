[package]
name = "tcal"
description = "Edit and merge iCalendars as ergonomic TOML"
version = "0.2.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "text-processing"]
keywords = ["icalendar", "calendar", "toml", "caldav", "editor"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/tcal/latest/tcal"
repository = "https://github.com/pimalaya/tcal"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:chrono", "dep:clap", "dep:pimalaya-cli", "dep:schemars", "dep:serde", "dep:uuid"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "tcal"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tcal"
path = "src/lib.rs"

[build-dependencies]
pimalaya-cli = { version = "0.4", default-features = false, features = ["build"], optional = true }

[[test]]
name = "output"
path = "tests/output.rs"
required-features = ["cli"]

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", default-features = false, features = ["std"] }
tempfile = { version = "3", default-features = false }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"], optional = true }
ical-rs = { version = "0.7", default-features = false, features = ["parser"] }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.4", default-features = false, features = ["prompt", "terminal"], optional = true }
schemars = { version = "1", default-features = false, features = ["derive"], optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
uuid = { version = "1", default-features = false, features = ["std", "v4"], optional = true }

[patch.crates-io]
pimalaya-cli = { git = "https://github.com/pimalaya/cli", rev = "8190dc544e277aeeba6acc43817100179f19643b" }
