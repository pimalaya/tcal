[package]
name = "tcal"
description = "CLI to edit iCalendars as ergonomic TOML"
version = "0.0.1"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "text-processing"]
keywords = ["icalendar", "calendar", "toml", "caldav", "editor"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/tcal/latest/tcal"
repository = "https://github.com/pimalaya/tcal"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
cli = ["dep:anyhow", "dep:chrono", "dep:clap", "dep:edit", "dep:pimalaya-cli", "dep:uuid"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "tcal"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tcal"
path = "src/lib.rs"

[build-dependencies]
pimalaya-cli = { version = "0.2", default-features = false, features = ["build"], optional = true }

[dev-dependencies]
proptest = "1"

[dependencies]
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4.4", features = ["derive", "env", "wrap_help"], optional = true }
edit = { version = "0.1", optional = true }
ical-rs = { version = "0.2", default-features = false, features = ["parser"] }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.2", default-features = false, features = ["prompt", "terminal"], optional = true }
thiserror = { version = "2", default-features = false }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"], optional = true }

[patch.crates-io]
ical-rs.git = "https://github.com/pimalaya/ical"
